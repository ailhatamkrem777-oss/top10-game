<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP 10 | التحدي الأسطوري - كرة القدم</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1d2943;--gold:#ffd166;--cyan:#55d6be;--text:#f4f7ff;--muted:#aab6d3;--red:#ff6b7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at top,#1d3154,var(--bg) 58%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:28px;font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}
.tag{border:1px solid #ffffff22;padding:7px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.card{background:#151d32eF;border:1px solid #ffffff16;border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 14px 40px #0003}
.hero{text-align:center;padding:20px 10px}.hero h1{font-size:clamp(24px,5vw,36px);margin:5px 0 12px}
.hero p{color:var(--muted);line-height:1.6;margin:0 auto 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.btn-tile{background:var(--panel2);border:2px solid #ffffff18;color:var(--text);border-radius:15px;padding:18px 10px;cursor:pointer;text-align:center;width:100%;font-size:16px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.15s;user-select:none;-webkit-user-select:none}
.btn-tile:active{transform:scale(0.97)}
.btn-tile.active{background:var(--cyan)!important;color:#171b28!important;border-color:#fff!important;box-shadow:0 0 15px rgba(85,214,190,0.4)}
.btn-tile .emoji{font-size:30px;line-height:1}
.main-btn{border:0;border-radius:13px;padding:14px;background:var(--gold);color:#171b28;font-weight:900;cursor:pointer;width:100%;font-size:18px;margin-top:15px;transition:.15s}
.main-btn:active{transform:scale(0.98)}
.main-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.question{font-size:clamp(20px,4vw,26px);line-height:1.5;margin:18px 0;text-align:right}
.answers{display:grid;grid-template-columns:1fr;gap:10px}
.answer{background:var(--panel2);color:var(--text);border:1px solid #ffffff20;text-align:right;padding:14px;border-radius:12px;font-size:16px;cursor:pointer;width:100%;transition:.15s}
.answer:active{filter:brightness(1.2)}
.pill{background:#0b1223;padding:7px 11px;border-radius:10px;color:var(--gold);font-weight:bold;font-size:14px}
.bar{height:8px;background:#ffffff15;border-radius:10px;overflow:hidden;margin-top:12px}
.bar div{height:100%;background:var(--cyan);width:0;transition:.2s}
.note{background:#0b1223;border-radius:12px;padding:12px;color:var(--muted);line-height:1.6;text-align:right;margin-top:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
input[type="text"],select{background:#0b1223;color:var(--text);border:1px solid #ffffff25;border-radius:12px;padding:12px;width:100%;font-size:16px}
.rank-inputs{display:grid;gap:8px;margin-top:10px}
.rank-row{display:flex;align-items:center;gap:8px}
.rank-row span{font-weight:bold;color:var(--gold);width:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">TOP <span>10</span></div><div class="tag">🎮 التحدي الأسطوري</div></header>
  
  <section id="home" class="card hero">
    <div style="font-size:40px">🏆</div><h1>منو يسيطر على القمة؟</h1>
    <p>اختر الصعوبة، ونمط اللعب للبدء!</p>
    
    <div id="diff-box" style="text-align:right;margin-top:20px">
      <h3 style="margin:0">1. اختر الصعوبة</h3>
      <div class="grid" id="diff-group">
        <button type="button" class="btn-tile" data-diff="easy"><span class="emoji">🟢</span><span>سهل</span></button>
        <button type="button" class="btn-tile" data-diff="medium"><span class="emoji">🟡</span><span>متوسط</span></button>
        <button type="button" class="btn-tile" data-diff="hard"><span class="emoji">🔴</span><span>صعب</span></button>
      </div>
    </div>

    <div id="mode-box" class="hidden" style="text-align:right;margin-top:20px">
      <h3 style="margin:0">2. اختر نمط اللعب</h3>
      <div class="grid" id="mode-group">
        <button type="button" class="btn-tile" data-mode="top10"><span class="emoji">🔟</span><span>تحدّي TOP 10</span></button>
        <button type="button" class="btn-tile" data-mode="quiz"><span class="emoji">🧠</span><span>اختيارات متعددة</span></button>
        <button type="button" class="btn-tile" data-mode="tf"><span class="emoji">⚖️</span><span>صح لو خطأ</span></button>
        <button type="button" class="btn-tile" data-mode="whoami"><span class="emoji">🕵️‍♂️</span><span>منو أني؟ (سيرة ذاتية)</span></button>
      </div>
    </div>

    <div style="text-align:right;margin-top:15px"><label style="display:block;margin-bottom:5px">عدد اللاعبين</label><select id="players"><option value="1">لاعب واحد</option><option value="2">لاعبان</option></select></div>
    
    <button type="button" class="main-btn" id="startBtn" disabled>ابدأ التحدي</button>
  </section>

  <section id="game" class="card hidden">
    <div class="between"><span class="pill" id="roundLabel">السؤال 1</span><span class="pill" id="scoreLabel">النقاط: 0</span></div>
    <div class="bar"><div id="progress"></div></div>
    <div class="question" id="question"></div>
    <div id="answers" class="answers"></div>
    <div id="textInputArea" class="hidden"></div>
    <div id="feedback" class="note hidden"></div>
    <button type="button" class="main-btn hidden" id="nextBtn" onclick="nextQuestion()">السؤال التالي ←</button>
  </section>

  <section id="result" class="card hero hidden">
    <div style="font-size:40px">🏆</div><h1>انتهاء التحدي!</h1><p id="resultText"></p>
    <button type="button" class="main-btn" onclick="location.reload()">العب مرة ثانية</button>
  </section>
</div>

<script>
function getLevenshteinDistance(a, b) {
  let tmp;
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  if (a.length > b.length) { tmp = a; a = b; b = tmp; }
  let i, j, row = [];
  for (i = 0; i <= a.length; i++) { row[i] = i; }
  for (i = 1; i <= b.length; i++) {
    let res = i;
    for (j = 1; j <= a.length; j++) {
      tmp = row[j - 1] + (a[j - 1] === b[i - 1] ? 0 : 1);
      row[j - 1] = res;
      res = Math.min(Math.min(tmp, row[j] + 1), res + 1);
    }
    row[a.length] = res;
  }
  return row[a.length];
}

function normalizeText(text) {
  return String(text).trim().toLowerCase()
    .replace(/[أإآ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/[\u064B-\u0652]/g, '')
    .replace(/\s+/g, ' ');
}

function isMatch(input, target) {
  let normInput = normalizeText(input);
  let normTarget = normalizeText(target);
  if (!normInput) return false;
  if (normInput === normTarget) return true;
  let dist = getLevenshteinDistance(normInput, normTarget);
  let maxLen = Math.max(normInput.length, normTarget.length);
  return (dist / maxLen) <= 0.25 || dist <= 2;
}

const db = {
  easy: [
    {q: "من هو المنتخب الفائز بكأس العالم 2022؟", a: ["الأرجنتين", "فرنسا", "البرازيل", "البرتغال"], top10: ["الأرجنتين", "فرنسا", "كرواتيا", "المغرب", "هولندا", "إنجلترا", "البرازيل", "البرتغال", "اليابان", "السنغال"], bio: "قاد منتخب بلاده لتحقيق لقب كأس العالم 2022 في قطر، ويعتبره الكثيرون أفضل لاعب في تاريخ كرة القدم.", answer: "الأرجنتين", t: "فازت الأرجنتين بقيادة ميسي."},
    {q: "كم عدد لاعبي فريق كرة القدم داخل الملعب؟", a: ["11 لاعباً", "10 لاعبين", "9 لاعبين", "12 لاعباً"], top10: ["11", "حارس", "مدافع", "وسط", "هجوم", "تبديل", "طرد", "خطأ", "تسلل", "ركنية"], bio: "هو العدد الأساسي للاعبي الفريق الواحد المسموح بتواجدهم على أرضية الملعب خلال مباراة رسمية.", answer: "11 لاعباً", t: "يبدأ كل فريق بـ 11 لاعباً أساسياً."}
  ],
  medium: [
    {q: "من هو الهداف التاريخي لدوري أبطال أوروبا؟", a: ["كريستيانو رونالدو", "ليونيل ميسي", "روبرت ليفاندوفسكي", "كريم بنزيما"], top10: ["رونالدو", "ميسي", "ليفاندوفسكي", "بنزيما", "راؤول", "فان نيستلروي", "مولر", "هنري", "إبراهيموفيتش", "شيفشينكو"], bio: "أسطورة برتغالية، يعتبر الهداف التاريخي لبطولة دوري أبطال أوروبا ولعب لأندية كبرى مثل ريال مدريد ومانشستر يونايتد.", answer: "كريستيانو رونالدو", t: "رونالدو يتصدر قائمة هدافي الأبطال."}
  ],
  hard: [
    {q: "في أي عام أقيمت أول بطولة كأس العالم لكرة القدم؟", a: ["1930", "1950", "1924", "1938"], top10: ["1930", "1934", "1938", "1950", "1954", "1958", "1962", "1966", "1970", "1974"], bio: "شهدت هذه السنة انطلاق أول نسخة من بطولة كأس العالم لكرة القدم، وأقيمت البطولة في دولة الأوروغواي.", answer: "1930", t: "أقيمت في الأوروغواي عام 1930."}
  ]
};

let selDiff = null, selMode = null;
let currentQ = 0, scores = [0,0], questions = [];

document.querySelectorAll('#diff-group .btn-tile').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('#diff-group .btn-tile').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    selDiff = this.getAttribute('data-diff');
    document.getElementById('mode-box').classList.remove('hidden');
    checkReady();
  };
});

document.querySelectorAll('#mode-group .btn-tile').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('#mode-group .btn-tile').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    selMode = this.getAttribute('data-mode');
    checkReady();
  };
});

function checkReady() {
  document.getElementById('startBtn').disabled = !(selDiff && selMode);
}

document.getElementById('startBtn').onclick = function() {
  let pool = db[selDiff] || db['easy'] || [];
  questions = [...pool].sort(() => Math.random() - 0.5);
  currentQ = 0; scores = [0, 0];
  
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  loadQuestion();
};

function loadQuestion() {
  let qData = questions[currentQ];
  document.getElementById('roundLabel').innerText = `السؤال ${currentQ + 1} من ${questions.length}`;
  document.getElementById('scoreLabel').innerText = `النقاط: ${scores[0]}`;
  document.getElementById('progress').style.width = `${((currentQ + 1) / questions.length) * 100}%`;
  document.getElementById('question').innerText = qData.q;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  
  let aBox = document.getElementById('answers');
  let textArea = document.getElementById('textInputArea');
  aBox.innerHTML = '';
  textArea.innerHTML = '';
  aBox.classList.remove('hidden');
  textArea.classList.add('hidden');

  if (selMode === 'top10') {
    document.getElementById('question').innerText = `[تحدّي الترتيب] رتب أهم العناصر الـ 10 المعنية (أدخل إجابتك لكل مركز):`;
    textArea.classList.remove('hidden');
    let html = `<div class="rank-inputs">`;
    for (let i = 1; i <= 10; i++) {
      html += `<div class="rank-row"><span>#${i}</span><input type="text" id="rankInput_${i}" placeholder="الخيار للمركز ${i}"></div>`;
    }
    html += `</div><button class="main-btn" type="button" onclick="submitTop10Text()">تأكيد الترتيب والتسليم 🚀</button>`;
    textArea.innerHTML = html;
  } else if (selMode === 'whoami') {
    document.getElementById('question').innerText = `[منو أني؟] اكتب الإجابة بناءً على الوصف:\n\n"${qData.bio}"`;
    textArea.classList.remove('hidden');
    textArea.innerHTML = `
      <input type="text" id="whoamiInput" placeholder="اكتب الإجابة هنا..." style="margin-bottom:10px;">
      <button class="main-btn" type="button" onclick="submitWhoAmIText()">تأكيد الإجابة 🕵️‍♂️</button>
    `;
  } else if (selMode === 'tf') {
    let isTrue = Math.random() > 0.5;
    document.getElementById('question').innerText = `${qData.q}\n\n(هل هذه العبارة صحيحة؟)`;
    let b1 = document.createElement('button');
    b1.className = 'answer'; b1.innerText = "صح ✓";
    b1.onclick = () => handleAnswer(isTrue, qData.t);
    let b2 = document.createElement('button');
    b2.className = 'answer'; b2.innerText = "خطأ ✗";
    b2.onclick = () => handleAnswer(!isTrue, qData.t);
    aBox.appendChild(b1); aBox.appendChild(b2);
  } else {
    let opts = qData.a.map((text, idx) => ({text, isCorrect: idx === 0}));
    opts.sort(() => Math.random() - 0.5);
    opts.forEach(opt => {
      let b = document.createElement('button');
      b.className = 'answer';
      b.innerText = opt.text;
      b.onclick = () => handleAnswer(opt.isCorrect, qData.t);
      aBox.appendChild(b);
    });
  }
}

function submitTop10Text() {
  let qData = questions[currentQ];
  let targetList = qData.top10;
  let pts = 0;
  let details = [];

  for (let i = 1; i <= 10; i++) {
    let val = document.getElementById(`rankInput_${i}`).value;
    let correctTarget = targetList[i - 1];
    if (isMatch(val, correctTarget)) {
      pts += (11 - i);
      details.push(`المركز ${i}: صح`);
    } else {
      details.push(`المركز ${i}: خطأ (${correctTarget})`);
    }
  }

  scores[0] += pts;
  let fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.innerHTML = `<b>حصدت ${pts} نقطة!</b><br>` + details.join('<br>');
  document.getElementById('scoreLabel').innerText = `النقاط: ${scores[0]}`;
  document.getElementById('nextBtn').classList.add('hidden');
}

function submitWhoAmIText() {
  let qData = questions[currentQ];
  let val = document.getElementById('whoamiInput').value;
  let correct = isMatch(val, qData.answer);
  if (correct) scores[0] += 10;
  
  let fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.innerHTML = `<b>${correct ? 'إجابة صحيحة! ✓' : 'إجابة خاطئة! ✗'}</b><br>الإجابة: (${qData.answer}).`;
  document.getElementById('scoreLabel').innerText = `النقاط: ${scores[0]}`;
  document.getElementById('nextBtn').classList.remove('hidden');
}

function handleAnswer(isCorrect, explanation) {
  document.querySelectorAll('.answer').forEach(btn => btn.disabled = true);
  if (isCorrect) scores[0] += 1;
  let fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.innerHTML = `<b>${isCorrect ? 'إجابة صحيحة! ✓' : 'إجابة خاطئة! ✗'}</b><br>${explanation}`;
  document.getElementById('scoreLabel').innerText = `النقاط: ${scores[0]}`;
  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion() {
  currentQ++;
  if (currentQ < questions.length) {
    loadQuestion();
  } else {
    document.getElementById('game').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('resultText').innerText = `جمعت ${scores[0]} من أصل ${questions.length} نقاط!`;
  }
}
</script>
</body>
</html>
