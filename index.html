<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOP 10 | التحدي الأسطوري</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1d2943;--gold:#ffd166;--cyan:#55d6be;--text:#f4f7ff;--muted:#aab6d3;--red:#ff6b7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at top,#1d3154,var(--bg) 58%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:28px;font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}
.tag{border:1px solid #ffffff22;padding:7px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.card{background:#151d32eF;border:1px solid #ffffff16;border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 14px 40px #0003}
.hero{text-align:center;padding:20px 10px}.hero h1{font-size:clamp(24px,5vw,36px);margin:5px 0 12px}
.hero p{color:var(--muted);line-height:1.6;margin:0 auto 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.btn-tile{background:var(--panel2);border:2px solid #ffffff18;color:var(--text);border-radius:15px;padding:18px 10px;cursor:pointer;text-align:center;width:100%;font-size:16px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.15s;user-select:none;-webkit-user-select:none}
.btn-tile:active{transform:scale(0.97)}
.btn-tile.active{background:var(--cyan)!important;color:#171b28!important;border-color:#fff!important;box-shadow:0 0 15px rgba(85,214,190,0.4)}
.btn-tile .emoji{font-size:30px;line-height:1}
.main-btn{border:0;border-radius:13px;padding:14px;background:var(--gold);color:#171b28;font-weight:900;cursor:pointer;width:100%;font-size:18px;margin-top:15px;transition:.15s}
.main-btn:active{transform:scale(0.98)}
.main-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.question{font-size:clamp(20px,4vw,26px);line-height:1.5;margin:18px 0;text-align:right}
.answers{display:grid;grid-template-columns:1fr;gap:10px}
.answer{background:var(--panel2);color:var(--text);border:1px solid #ffffff20;text-align:right;padding:14px;border-radius:12px;font-size:16px;cursor:pointer;width:100%;transition:.15s}
.answer:active{filter:brightness(1.2)}
.pill{background:#0b1223;padding:7px 11px;border-radius:10px;color:var(--gold);font-weight:bold;font-size:14px}
.bar{height:8px;background:#ffffff15;border-radius:10px;overflow:hidden;margin-top:12px}
.bar div{height:100%;background:var(--cyan);width:0;transition:.2s}
.note{background:#0b1223;border-radius:12px;padding:12px;color:var(--muted);line-height:1.6;text-align:right;margin-top:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
select{background:#0b1223;color:var(--text);border:1px solid #ffffff25;border-radius:12px;padding:12px;width:100%;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">TOP <span>10</span></div><div class="tag">🎮 التحدي الأسطوري</div></header>
  
  <section id="home" class="card hero">
    <div style="font-size:40px">🏆</div><h1>منو يسيطر على القمة؟</h1>
    <p>اختر التصنيف، الصعوبة، ونمط اللعب للبدء!</p>
    
    <div style="text-align:right;margin-top:15px"><h3 style="margin:0">1. اختر التصنيف</h3></div>
    <div class="grid" id="cat-group">
      <button type="button" class="btn-tile" data-cat="football"><span class="emoji">⚽</span><span>كرة القدم</span></button>
      <button type="button" class="btn-tile" data-cat="anime"><span class="emoji">🍥</span><span>أنمي</span></button>
      <button type="button" class="btn-tile" data-cat="movies"><span class="emoji">🎬</span><span>أفلام ومسلسلات</span></button>
      <button type="button" class="btn-tile" data-cat="games"><span class="emoji">🎮</span><span>ألعاب فيديو</span></button>
      <button type="button" class="btn-tile" data-cat="music"><span class="emoji">🎨</span><span>فن وموسيقى</span></button>
      <button type="button" class="btn-tile" data-cat="general"><span class="emoji">🌍</span><span>معلومات عامة</span></button>
    </div>
    
    <div id="diff-box" class="hidden" style="text-align:right;margin-top:20px">
      <h3 style="margin:0">2. اختر الصعوبة</h3>
      <div class="grid" id="diff-group">
        <button type="button" class="btn-tile" data-diff="easy"><span class="emoji">🟢</span><span>سهل</span></button>
        <button type="button" class="btn-tile" data-diff="medium"><span class="emoji">🟡</span><span>متوسط</span></button>
        <button type="button" class="btn-tile" data-diff="hard"><span class="emoji">🔴</span><span>صعب</span></button>
      </div>
    </div>

    <div id="mode-box" class="hidden" style="text-align:right;margin-top:20px">
      <h3 style="margin:0">3. اختر نمط اللعب</h3>
      <div class="grid" id="mode-group">
        <button type="button" class="btn-tile" data-mode="top10"><span class="emoji">🔟</span><span>تحدّي TOP 10</span></button>
        <button type="button" class="btn-tile" data-mode="quiz"><span class="emoji">🧠</span><span>اختيارات متعددة</span></button>
        <button type="button" class="btn-tile" data-mode="tf"><span class="emoji">⚖️</span><span>صح لو خطأ</span></button>
        <button type="button" class="btn-tile" data-mode="whoami"><span class="emoji">🕵️‍♂️</span><span>منو أني؟</span></button>
      </div>
    </div>

    <div style="text-align:right;margin-top:15px"><label style="display:block;margin-bottom:5px">عدد اللاعبين</label><select id="players"><option value="1">لاعب واحد</option><option value="2">لاعبان</option></select></div>
    
    <button type="button" class="main-btn" id="startBtn" disabled>ابدأ التحدي</button>
  </section>

  <section id="game" class="card hidden">
    <div class="between"><span class="pill" id="roundLabel">السؤال 1</span><span class="pill" id="scoreLabel">النقاط: 0</span></div>
    <div class="bar"><div id="progress"></div></div>
    <div class="question" id="question"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="note hidden"></div>
    <button type="button" class="main-btn hidden" id="nextBtn" onclick="nextQuestion()">السؤال التالي ←</button>
  </section>

  <section id="result" class="card hidden hero">
    <div style="font-size:40px">🏆</div><h1>انتهاء التحدي!</h1><p id="resultText"></p>
    <button type="button" class="main-btn" onclick="location.reload()">العب مرة ثانية</button>
  </section>
</div>

<script>
const db = {
  football: {
    easy: [
      {q: "من هو المنتخب الفائز بكأس العالم 2022؟", a: ["الأرجنتين", "فرنسا", "البرازيل", "البرتغال"], t: "فازت الأرجنتين بقيادة ميسي."},
      {q: "كم عدد لاعبي فريق كرة القدم داخل الملعب؟", a: ["11 لاعباً", "10 لاعبين", "9 لاعبين", "12 لاعباً"], t: "يبدأ كل فريق بـ 11 لاعباً أساسياً."}
    ],
    medium: [
      {q: "من هو الهداف التاريخي لدوري أبطال أوروبا؟", a: ["كريستيانو رونالدو", "ليونيل ميسي", "روبرت ليفاندوفسكي", "بنزيما"], t: "رونالدو يتصدر قائمة هدافي الأبطال."}
    ],
    hard: [
      {q: "في أي عام أقيمت أول بطولة كأس العالم لكرة القدم؟", a: ["1930", "1950", "1924", "1938"], t: "أقيمت في الأوروغواي عام 1930."}
    ]
  },
  anime: {
    easy: [
      {q: "من هو بطل أنمي ون بيس (One Piece)؟", a: ["مونكي دي لوفي", "رورونوا زورو", "سانجي", "شانكس"], t: "لوفي طموحه أن يصبح ملك القراصنة."},
      {q: "ما اسم القرية التي ينتمي إليها ناروتو؟", a: ["قرية الورق (كونوها)", "قرية الرمل", "قرية الضباب", "قرية السحاب"], t: "ناروتو نشأ في قرية الورق المخفية."}
    ],
    medium: [
      {q: "ما اسم بطل أنمي قاتل الشياطين؟", a: ["تانجيرو كامادو", "نزوكو", "زينيتسو", "إينوسكي"], t: "تانجيرو ينضم لفيلق قتلة الشياطين."}
    ],
    hard: [
      {q: "ما اسم بطل أنمي هنتر × هنتر الرئيسي؟", a: ["غون فريكس", "كيلوا زولديك", "كورابيكا", "هيسوكا"], t: "غون فريكس يبحث عن أبيه جين."}
    ]
  },
  movies: {
    easy: [
      {q: "ما اسم مدرسة السحر في سلسلة أفلام هاري بوتر؟", a: ["هوجورتس", "نارنيا", "كاميلوت", "أكسفورد"], t: "مدرسة هوجورتس السحرية الشهيرة."},
      {q: "من هو بطل سلسلة أفلام آيرون مان؟", a: ["توني ستارك", "بروس واين", "بيتر باركر", "كلارك كنت"], t: "توني ستارك هو الشخصية العبقرية خلف الدرع."}
    ],
    medium: [
      {q: "أي فيلم للمخرج كريستوفر نولان يتحدث عن الأحلام المتداخلة؟", a: ["Inception", "Interstellar", "Tenet", "Memento"], t: "فيلم إنسبشن الأسطوري."}
    ],
    hard: [
      {q: "ما الفيلم الذي حقق الرقم القياسي بالفوز بـ 11 جائزة أوسكار؟", a: ["تايتانيك", "أفاتار", "المصارع", "الجوكر"], t: "تايتانيك حقق 11 أوسكار تاريخية."}
    ]
  },
  games: {
    easy: [
      {q: "أي شركة طوّرت لعبة ماينكرافت (Minecraft)؟", a: ["Mojang", "Valve", "Nintendo", "Ubisoft"], t: "موجانغ هي المطور الأساسي لماينكرافت."},
      {q: "ما اسم بطل ألعاب ماريو من نينتندو؟", a: ["ماريو", "سونيك", "لويجي", "كراش"], t: "ماريو هو أشهر سباك وأيقونة ألعاب."}
    ],
    medium: [
      {q: "ما اسم إله الحرب وبطل سلسلة God of War؟", a: ["كريتوس", "زهاوس", "أثينا", "أرس"], t: "كريتوس المحارب الإسبرطي الشهير."}
    ],
    hard: [
      {q: "ما اسم الفطريات المسؤولة عن تحول البشر بزومبي في The Last of Us؟", a: ["كوردايسبس (Cordyceps)", "تيدروس", "فيروس إكس", "المتحورة ب"], t: "فطر كوردايسبس الحقيقي المتحكم بالحشرات."}
    ]
  },
  music: {
    easy: [
      {q: "ما هي الآلة الموسيقية التي تحتوي على مفاتيح سوداء وبيضاء؟", a: ["البيانو", "الجيتار", "الكمان", "الناي"], t: "البيانو هو ملك الآلات الموسيقية."}
    ],
    medium: [
      {q: "أي فنان تشكيلي اشتهر بقطع أذنه ولوحة ليلة مرصعة بالنجوم؟", a: ["فان جوخ", "بيكاسو", "مونيه", "سيزان"], t: "فينسنت فان جوخ من أعظم الرسامين."}
    ],
    hard: [
      {q: "أي مؤلف موسيقي كلاسيكي استمر بالتأليف رغم فقدانه للسمع؟", a: ["بتهوفن", "موتسارت", "باخ", "ففالدي"], t: "لودفيغ فان بتهوفن أبدع رغم الصمم."}
    ]
  },
  general: {
    easy: [
      {q: "ما هو أكبر كوكب في المجموعة الشمسية؟", a: ["المشتري", "زحل", "المريخ", "الأرض"], t: "المشتري أكبر كواكب مجموعتنا الشمسية."},
      {q: "ما هي عاصمة جمهورية العراق؟", a: ["بغداد", "البصرة", "أربيل", "الموصل"], t: "بغداد العاصمة التاريخية."}
    ],
    medium: [
      {q: "ما هو أعمق محيط على وجه الأرض؟", a: ["المحيط الهادئ", "المحيط الأطلسي", "المحيط الهندي", "المحيط المتجمد الشمالي"], t: "المحيط الهادئ يحوي خندق ماريانا."}
    ],
    hard: [
      {q: "ما هو العنصر الكيميائي الذي يمتلك أعلى درجة انصهار؟", a: ["التنجستن", "الحديد", "الكربون", "الذهب"], t: "التنجستن يمتلك أعلى نقطة انصهار."}
    ]
  }
};

let selCat = null, selDiff = null, selMode = null;
let currentQ = 0, score = 0, questions = [];

document.querySelectorAll('#cat-group .btn-tile').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('#cat-group .btn-tile').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    selCat = this.getAttribute('data-cat');
    document.getElementById('diff-box').classList.remove('hidden');
    checkReady();
  };
});

document.querySelectorAll('#diff-group .btn-tile').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('#diff-group .btn-tile').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    selDiff = this.getAttribute('data-diff');
    document.getElementById('mode-box').classList.remove('hidden');
    checkReady();
  };
});

document.querySelectorAll('#mode-group .btn-tile').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('#mode-group .btn-tile').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    selMode = this.getAttribute('data-mode');
    checkReady();
  };
});

function checkReady() {
  document.getElementById('startBtn').disabled = !(selCat && selDiff && selMode);
}

document.getElementById('startBtn').onclick = function() {
  let catObj = db[selCat];
  let pool = catObj[selDiff] || catObj['easy'] || [];
  questions = [...pool].sort(() => Math.random() - 0.5);
  currentQ = 0; score = 0;
  
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  loadQuestion();
};

function loadQuestion() {
  let qData = questions[currentQ];
  document.getElementById('roundLabel').innerText = `السؤال ${currentQ + 1} من ${questions.length}`;
  document.getElementById('scoreLabel').innerText = `النقاط: ${score}`;
  document.getElementById('progress').style.width = `${((currentQ + 1) / questions.length) * 100}%`;
  document.getElementById('question').innerText = qData.q;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  
  let aBox = document.getElementById('answers');
  aBox.innerHTML = '';
  
  let opts = qData.a.map((text, idx) => ({text, isCorrect: idx === 0}));
  opts.sort(() => Math.random() - 0.5);
  
  opts.forEach(opt => {
    let b = document.createElement('button');
    b.type = 'button';
    b.className = 'answer';
    b.innerText = opt.text;
    b.onclick = function() {
      document.querySelectorAll('.answer').forEach(btn => btn.disabled = true);
      if(opt.isCorrect) score++;
      let fb = document.getElementById('feedback');
      fb.classList.remove('hidden');
      fb.innerHTML = `<b>${opt.isCorrect ? 'إجابة صحيحة! ✓' : 'إجابة خاطئة! ✗'}</b><br>${qData.t}`;
      document.getElementById('scoreLabel').innerText = `النقاط: ${score}`;
      document.getElementById('nextBtn').classList.remove('hidden');
    };
    aBox.appendChild(b);
  });
}

function nextQuestion() {
  currentQ++;
  if(currentQ < questions.length) {
    loadQuestion();
  } else {
    document.getElementById('game').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('resultText').innerText = `جمعت ${score} من أصل ${questions.length} نقاط!`;
  }
}
</script>
</body>
</html>
