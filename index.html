<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة التحدي والمعرفة</title>
<style>
:root{--bg:#0b1020;--card:#151f36;--tile:#253451;--purple:#7959ff;--cyan:#23ddd0;--green:#24c987;--red:#ff627d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#202d55,#0b1020 65%);color:#f5f7ff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.container{max-width:950px;margin:auto;padding:16px}
header{text-align:center;padding:20px 0}
header .logo{font-size:45px}
h1{font-size:clamp(25px,5vw,38px);margin:8px 0}
.muted{color:#b2bfd9;line-height:1.8}
.panel{background:var(--card);border:1px solid #354361;border-radius:18px;padding:20px;margin-bottom:16px}
h2{margin-top:0}
h3{margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
button,input,select{font:inherit}
button{cursor:pointer}
.choice,.answer,.secondary{color:white;background:var(--tile);border:2px solid transparent;border-radius:12px;padding:13px}
.choice.selected{border-color:var(--cyan);background:#16404b}
.choice:hover,.answer:hover{border-color:var(--cyan)}
.primary{color:white;background:linear-gradient(120deg,var(--purple),#438cff);border:0;border-radius:12px;padding:15px;font-weight:bold}
.secondary{border-color:#394866}
.full{width:100%;margin-top:16px}
label{display:block;color:#b2bfd9;margin:12px 0 7px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #405071;background:#0e172b;color:white}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hidden{display:none!important}
.pill{display:inline-block;padding:7px 11px;background:#253451;color:var(--cyan);border-radius:25px;margin:3px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.stat{background:#0e172b;border-radius:12px;padding:12px;text-align:center;color:#b2bfd9}
.stat strong{display:block;color:var(--cyan);font-size:23px;margin-top:5px}
.progress{height:8px;background:#303d58;border-radius:20px;overflow:hidden;margin:15px 0}
.progress div{height:100%;width:0;background:var(--cyan);transition:.25s}
.question{font-size:clamp(20px,4vw,28px);line-height:1.8;margin:22px 0}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.answer{text-align:right;min-height:58px;border-color:#394866}
.answer.correct{background:#124733;border-color:var(--green)}
.answer.wrong{background:#512337;border-color:var(--red)}
.answer:disabled{cursor:default}
.feedback{padding:14px;border-radius:12px;margin-top:14px;line-height:1.8}
.good{background:#124733;color:#a8f7ce}
.bad{background:#512337;color:#ffc0cb}
.center{text-align:center}
.big{font-size:48px;color:var(--cyan);font-weight:bold}
.player{display:flex;justify-content:space-between;gap:10px;background:#0e172b;padding:13px;border-radius:10px;margin:8px 0}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memory button{height:75px;font-size:27px;border:1px solid #394866;background:var(--tile);color:white;border-radius:12px}
.memory button.matched{background:#124733;border-color:var(--green)}
.small{font-size:13px;color:#b2bfd9}
footer{text-align:center;color:#8e9bb9;padding:20px}
@media(max-width:520px){.container{padding:10px}.panel{padding:14px}.answers{grid-template-columns:1fr}.memory button{height:65px}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">🏆</div>
<h1>منصة التحدي والمعرفة</h1>
<div class="muted">تحدَّ معلوماتك، نافس أصدقاءك، واثبت منو الأذكى!</div>
</header>

<section class="panel" id="home">
<h2>🎮 إعداد التحدي</h2>

<h3>طريقة اللعب</h3>
<div class="grid" id="modes">
<button class="choice selected" data-value="solo">👤 فردي</button>
<button class="choice" data-value="players">👥 لاعبين</button>
<button class="choice" data-value="teams">🛡️ فرق</button>
</div>

<div id="multiSettings" class="row hidden">
<div id="countBox">
<label>عدد اللاعبين</label>
<select id="playerCount">
<option value="2">لاعبان</option><option value="3">3 لاعبين</option>
<option value="4">4 لاعبين</option><option value="5">5 لاعبين</option><option value="6">6 لاعبين</option>
</select>
</div>
<div id="teamBox" class="hidden">
<label>عدد الفرق</label>
<select id="teamCount"><option value="2">فريقان</option><option value="3">3 فرق</option></select>
</div>
<div>
<label>أسماء اللاعبين أو الفرق، افصل بفاصلة</label>
<input id="names" placeholder="علي، حسن، محمد">
</div>
</div>

<h3>الفعالية</h3>
<div class="grid" id="activities">
<button class="choice selected" data-value="quiz">🧠 سؤال وجواب</button>
<button class="choice" data-value="top10">🔟 توب 10</button>
<button class="choice" data-value="memory">🃏 الذاكرة</button>
<button class="choice" data-value="tf">✅ صح أو خطأ</button>
<button class="choice" data-value="who">🕵️ منو أني؟</button>
</div>

<h3>التصنيف</h3>
<div class="grid" id="categories">
<button class="choice selected" data-value="all">🌐 الكل</button>
<button class="choice" data-value="football">⚽ كرة القدم</button>
<button class="choice" data-value="history">🏛️ التاريخ</button>
<button class="choice" data-value="geography">🌍 الجغرافية</button>
<button class="choice" data-value="science">🔬 العلوم</button>
<button class="choice" data-value="games">🎮 الألعاب</button>
<button class="choice" data-value="anime">🍥 الأنمي</button>
<button class="choice" data-value="general">💡 عامة</button>
</div>

<h3>الصعوبة</h3>
<div class="grid" id="difficulties">
<button class="choice" data-value="easy">🟢 سهل</button>
<button class="choice selected" data-value="medium">🟡 متوسط</button>
<button class="choice" data-value="hard">🔴 صعب</button>
<button class="choice" data-value="mixed">🎲 عشوائي</button>
</div>

<div class="row">
<div><label>عدد الأسئلة</label>
<select id="questionCount"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
<div><label>وقت السؤال</label>
<select id="seconds"><option value="0">بدون مؤقت</option><option value="10">10 ثوانٍ</option><option selected value="15">15 ثانية</option><option value="30">30 ثانية</option></select></div>
</div>

<button type="button" class="primary full" id="start">🚀 بدء التحدي</button>
<div id="error" class="feedback bad hidden"></div>
</section>

<section class="panel hidden" id="game">
<div><span class="pill" id="activityLabel"></span><span class="pill" id="categoryLabel"></span></div>
<div class="stats">
<div class="stat">السؤال<strong id="number">1/10</strong></div>
<div class="stat">النقاط<strong id="score">0</strong></div>
<div class="stat">الوقت<strong id="timer">15</strong></div>
</div>
<div class="progress"><div id="bar"></div></div>
<div id="content"></div>
<div id="feedback" class="feedback hidden"></div>
<button type="button" class="primary full hidden" id="next">السؤال التالي ←</button>
<button type="button" class="secondary full" id="quit">إنهاء الجولة</button>
</section>

<section class="panel hidden center" id="result">
<div class="logo">🏆</div><h2 id="resultTitle">انتهى التحدي!</h2>
<div class="big" id="finalScore">0</div><p class="muted" id="resultMessage"></p>
<div id="ranking"></div>
<button type="button" class="primary full" id="again">🔄 إعادة اللعب</button>
<button type="button" class="secondary full" id="back">الإعدادات</button>
</section>
<footer>منصة التحدي والمعرفة</footer>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const all=(sel,root=document)=>Array.from(root.querySelectorAll(sel));
const state={mode:"solo",activity:"quiz",category:"all",difficulty:"medium"};
let players=[],round=[],index=0,turn=0,timerId=null,timeLeft=0,answered=false;
let memoryDeck=[],memoryOpen=[],memoryPairs=0,memoryMoves=0,topFound=0;

const questions=[
["football","easy","كم لاعباً يبدأ به فريق كرة القدم؟",["9","10","11","12"],2],
["football","easy","من فاز بكأس العالم 2022؟",["فرنسا","الأرجنتين","البرازيل","ألمانيا"],1],
["football","easy","كم دقيقة مدة المباراة الأصلية؟",["60","80","90","100"],2],
["football","medium","من فاز بكأس العالم 2018؟",["كرواتيا","فرنسا","بلجيكا","إسبانيا"],1],
["football","medium","ما ملعب نادي ليفربول؟",["أنفيلد","ويمبلي","سان سيرو","كامب نو"],0],
["football","hard","من فاز بأول كأس عالم سنة 1930؟",["الأرجنتين","إيطاليا","أوروغواي","البرازيل"],2],
["football","hard","أي منتخب فاز بكأس العالم 2010؟",["ألمانيا","إسبانيا","هولندا","الأوروغواي"],1],
["history","easy","أين تقع أهرامات الجيزة؟",["العراق","مصر","اليونان","الهند"],1],
["history","easy","أي حضارة قديمة نشأت في جنوب بلاد الرافدين؟",["السومرية","المايا","الإغريقية","الرومانية"],0],
["history","medium","في أي سنة انتهت الحرب العالمية الثانية؟",["1939","1942","1945","1950"],2],
["history","medium","من ارتبط اسمه بشريعة بابلية مشهورة؟",["حمورابي","الإسكندر","قيصر","نبوخذ نصر"],0],
["history","hard","في أي سنة سقطت القسطنطينية بيد العثمانيين؟",["1258","1453","1492","1517"],1],
["geography","easy","ما عاصمة العراق؟",["البصرة","بغداد","الموصل","النجف"],1],
["geography","easy","ما أكبر محيط في العالم؟",["الأطلسي","الهندي","الهادئ","المتجمد الشمالي"],2],
["geography","medium","ما عاصمة أستراليا؟",["سيدني","ملبورن","كانبيرا","بيرث"],2],
["geography","medium","أي قارة تضم أكبر عدد من الدول؟",["آسيا","أفريقيا","أوروبا","أمريكا الجنوبية"],1],
["geography","hard","ما عاصمة منغوليا؟",["كاتماندو","أولان باتور","طشقند","بيشكيك"],1],
["science","easy","ما الكوكب الأحمر؟",["الزهرة","المريخ","المشتري","عطارد"],1],
["science","easy","ما الغاز الضروري لتنفس الإنسان؟",["الهيليوم","الأكسجين","الهيدروجين","النيون"],1],
["science","medium","ما الصيغة الكيميائية للماء؟",["CO2","O2","H2O","NaCl"],2],
["science","medium","أي عضو يضخ الدم؟",["الرئة","الكبد","القلب","المعدة"],2],
["science","hard","ما وحدة قياس المقاومة الكهربائية؟",["الفولت","الأمبير","الأوم","الواط"],2],
["science","hard","ما العملية التي تصنع بها النباتات غذاءها؟",["التبخر","البناء الضوئي","التكاثف","التجمد"],1],
["games","easy","من طور Minecraft؟",["Mojang","Ubisoft","Valve","Nintendo"],0],
["games","easy","أي سلسلة ألعاب تضم شخصية كريتوس؟",["God of War","FIFA","Minecraft","Forza"],0],
["games","medium","من الشركة المطورة لسلسلة Zelda؟",["Sony","Nintendo","EA","Rockstar"],1],
["games","hard","من طور The Witcher 3؟",["CD Projekt Red","Naughty Dog","Mojang","Valve"],0],
["anime","easy","من بطل One Piece؟",["ناروتو","لوفي","إيتادوري","إيتشيغو"],1],
["anime","easy","من بطل أنمي Naruto؟",["ساسكي","كاكاشي","ناروتو","غاارا"],2],
["anime","medium","ما اسم أخت تانجيرو في Demon Slayer؟",["زينيتسو","إينوسكي","نيزوكو","غيو"],2],
["anime","medium","ما اسم دفتر القتل في Death Note؟",["Black Book","Death Note","Soul Book","Dark File"],1],
["anime","hard","من مؤلف مانغا Attack on Titan؟",["إييتشيرو أودا","هاجيمي إيساياما","كيشيموتو","فوجيموتو"],1],
["general","easy","كم يوماً في الأسبوع؟",["5","6","7","8"],2],
["general","easy","ما اللغة الرسمية في البرازيل؟",["الإسبانية","البرتغالية","الفرنسية","الإنجليزية"],1],
["general","medium","من رسم لوحة الموناليزا؟",["فان غوخ","ليوناردو دا فينشي","بيكاسو","مونيه"],1],
["general","medium","كم ضلعاً للمسدس؟",["5","6","7","8"],1],
["general","hard","كم ضلعاً للمكعب؟",["6","8","12","16"],2]
].map(x=>({c:x[0],d:x[1],q:x[2],a:x[3],k:x[4]}));

const tfQuestions=[
{c:"science",q:"الشمس نجم وليست كوكباً.",k:true},
{c:"geography",q:"عاصمة أستراليا هي سيدني.",k:false,why:"عاصمة أستراليا هي كانبيرا."},
{c:"football",q:"يبدأ فريق كرة القدم عادةً بـ11 لاعباً.",k:true},
{c:"geography",q:"المحيط الأطلسي أكبر من المحيط الهادئ.",k:false,why:"المحيط الهادئ هو الأكبر."},
{c:"science",q:"الماء يتكون من الهيدروجين والأكسجين.",k:true},
{c:"football",q:"فازت البرازيل بكأس العالم 2022.",k:false,why:"الفائز كان الأرجنتين."},
{c:"geography",q:"بغداد عاصمة العراق.",k:true},
{c:"games",q:"شركة Nintendo هي التي طورت Minecraft.",k:false,why:"طورت اللعبة شركة Mojang."},
{c:"science",q:"للعنكبوت ثماني أرجل.",k:true},
{c:"history",q:"انتهت الحرب العالمية الثانية سنة 1945.",k:true}
];

const top10=[
{q:"اذكر كوكباً من كواكب المجموعة الشمسية",a:["عطارد","الزهرة","الأرض","المريخ","المشتري","زحل","أورانوس","نبتون"]},
{q:"اذكر دولة عربية",a:["العراق","السعودية","مصر","الأردن","سوريا","لبنان","الكويت","قطر","البحرين","عُمان"]},
{q:"اذكر مركزاً في كرة القدم",a:["حارس مرمى","قلب دفاع","ظهير","محور","وسط","جناح","صانع ألعاب","مهاجم","رأس حربة","وسط هجومي"]},
{q:"اذكر حيواناً يعيش في الماء",a:["الدلفين","الحوت","القرش","الأخطبوط","السلحفاة البحرية","قنديل البحر","فرس البحر","الفقمة","الراي","ثعبان البحر"]},
{q:"اذكر قارة من قارات العالم",a:["آسيا","أفريقيا","أوروبا","أمريكا الشمالية","أمريكا الجنوبية","أستراليا","أنتاركتيكا"]}
];
const whoQuestions=[
{q:"أنا كوكب يُعرف بالكوكب الأحمر. من أكون؟",a:["المريخ","الزهرة","زحل","عطارد"],k:0},
{q:"أنا لاعب أرجنتيني فاز بكأس العالم 2022. من أكون؟",a:["رونالدو","ميسي","دي ماريا","أغويرو"],k:1},
{q:"أنا نهر مشهور في العراق، وأجري مع دجلة. من أكون؟",a:["النيل","الفرات","الأردن","العاصي"],k:1},
{q:"أحلم بأن أصبح ملك القراصنة في الأنمي. من أكون؟",a:["لوفي","ناروتو","غوكو","إيتادوري"],k:0}
];
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function selectGroup(id,key){
$(id).addEventListener("click",e=>{
const b=e.target.closest("[data-value]");if(!b)return;
all("#"+id+" .choice").forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");state[key]=b.dataset.value;updateSettings();
});
}
selectGroup("modes","mode");selectGroup("activities","activity");
selectGroup("categories","category");selectGroup("difficulties","difficulty");

function updateSettings(){
$("multiSettings").classList.toggle("hidden",state.mode==="solo");
$("countBox").classList.toggle("hidden",state.mode!=="players");
$("teamBox").classList.toggle("hidden",state.mode!=="teams");
}
updateSettings();

function makePlayers(){
const names=$("names").value.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
if(state.mode==="solo")return[{name:names[0]||"اللاعب",score:0}];
const n=state.mode==="teams"?Number($("teamCount").value):Number($("playerCount").value);
return Array.from({length:n},(_,i)=>({name:names[i]||(state.mode==="teams"?"الفريق ":"اللاعب ")+(i+1),score:0}));
}
function startGame(){
try{
clearInterval(timerId);timerId=null;
players=makePlayers();index=0;turn=0;answered=false;
memoryOpen=[];memoryPairs=0;memoryMoves=0;topFound=0;
$("error").classList.add("hidden");
$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");
$("activityLabel").textContent=({quiz:"سؤال وجواب",top10:"توب 10",memory:"الذاكرة",tf:"صح أو خطأ",who:"منو أني؟"})[state.activity];
$("categoryLabel").textContent=state.category==="all"?"كل التصنيفات":state.category;
if(state.activity==="memory"){startMemory();return}
if(state.activity==="top10"){round=shuffle(top10).slice(0,Math.min(5,Number($("questionCount").value)));showTop10();return}
if(state.activity==="tf"){
let a=tfQuestions.filter(q=>state.category==="all"||q.c===state.category);if(!a.length)a=tfQuestions;
round=shuffle(a).slice(0,Math.min(Number($("questionCount").value),a.length));
}else if(state.activity==="who"){
round=shuffle(whoQuestions).slice(0,Math.min(Number($("questionCount").value),whoQuestions.length));
}else{
let a=questions.filter(q=>(state.category==="all"||q.c===state.category)&&(state.difficulty==="mixed"||q.d===state.difficulty));
if(!a.length)a=questions.filter(q=>state.category==="all"||q.c===state.category);
if(!a.length)a=questions;
round=shuffle(a).slice(0,Math.min(Number($("questionCount").value),a.length));
}
showQuestion();
}catch(err){
$("game").classList.add("hidden");$("home").classList.remove("hidden");
$("error").textContent="صار خطأ أثناء بدء اللعبة: "+err.message;
$("error").classList.remove("hidden");console.error(err);
}
}
$("start").addEventListener("click",startGame);
$("next").addEventListener("click",next);
$("quit").addEventListener("click",()=>finish(true));
$("again").addEventListener("click",startGame);
$("back").addEventListener("click",home);

function showQuestion(){
clearInterval(timerId);timerId=null;answered=false;
$("feedback").classList.add("hidden");$("next").classList.add("hidden");
const q=round[index];if(!q){finish();return}
$("number").textContent=(index+1)+"/"+round.length;
$("bar").style.width=(index/round.length*100)+"%";
$("score").textContent=players.reduce((s,p)=>s+p.score,0);
$("timer").textContent=$("seconds").value==="0"?"∞":$("seconds").value;
$("quit").classList.remove("hidden");
$("content").innerHTML=`<div class="question">${esc(q.q)}</div>`;
if(state.activity==="tf"){
$("content").innerHTML+=`<div class="answers"><button class="answer" data-tf="true">✅ صح</button><button class="answer" data-tf="false">❌ خطأ</button></div>`;
}else{
let choices=q.a.map((v,i)=>({v,i}));if(state.activity!=="who")choices=shuffle(choices);
$("content").innerHTML+=`<div class="answers">${choices.map(x=>`<button class="answer" data-answer="${x.i}">${esc(x.v)}</button>`).join("")}</div>`;
}
$("turnLabel")?.remove();
all(".answer",$("content")).forEach(b=>b.addEventListener("click",()=>{
if(state.activity==="tf")check(b.dataset.tf==="true");
else check(Number(b.dataset.answer));
}));
startTimer();
}
function startTimer(){
clearInterval(timerId);let s=Number($("seconds").value);timeLeft=s;
if(!s){$("timer").textContent="∞";return}
$("timer").textContent=timeLeft;
timerId=setInterval(()=>{timeLeft--;$("timer").textContent=timeLeft;if(timeLeft<=0){clearInterval(timerId);timerId=null;if(!answered)timeoutAnswer()}},1000);
}
function timeoutAnswer(){
answered=true;all(".answer",$("content")).forEach(b=>b.disabled=true);
$("feedback").textContent="⏰ انتهى الوقت!";$("feedback").className="feedback bad";$("feedback").classList.remove("hidden");showNext();
}
